<svg xmlns="http://www.w3.org/2000/svg"
     width="520" height="200"
     viewBox="0 0 520 200"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <defs>
    <pattern id="dv-nocolor-pattern" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(-45)">
      <rect width="5" height="10" fill="grey"/>
      <rect x="5" width="5" height="10" fill="black"/>
    </pattern>
  </defs>

  <!-- outer card background -->
  <rect x="0" y="0" width="520" height="200" rx="8" fill="#1e1e2e" />

  <!-- section label -->
  <text x="14" y="22" font-size="9" fill="#9999bb" letter-spacing="0.08em" text-transform="uppercase">SVG RENDERER — PORT STATUS</text>

  <!-- ── Device canvas (matches real renderer: PADDING=6, GAP=2, cell=16) ── -->
  <!-- canvas bg: 8 ports * (16+2) - 2 + 2*6 = 144+10 = 154 wide, 16+12=28 tall -->
  <rect x="14" y="32" width="154" height="28" rx="5" fill="#d9d9d9" stroke="#999" stroke-width="1"/>

  <!-- Port 1: full connection — bg-success -->
  <g class="dv-port">
    <rect x="20"  y="38" width="16" height="16" rx="3" fill="#198754" stroke="#cccccc" stroke-width="1"/>
    <text x="28"  y="46" text-anchor="middle" dominant-baseline="central" font-size="7" fill="#fff">1</text>
  </g>

  <!-- Port 2: full connection — bg-success -->
  <g class="dv-port">
    <rect x="38"  y="38" width="16" height="16" rx="3" fill="#198754" stroke="#cccccc" stroke-width="1"/>
    <text x="46"  y="46" text-anchor="middle" dominant-baseline="central" font-size="7" fill="#fff">2</text>
  </g>

  <!-- Port 3: partial — bg-warning + dot -->
  <g class="dv-port">
    <rect x="56"  y="38" width="16" height="16" rx="3" fill="#ffc107" stroke="#cccccc" stroke-width="1"/>
    <text x="64"  y="46" text-anchor="middle" dominant-baseline="central" font-size="7" fill="#fff">3</text>
    <circle cx="69.5" cy="40.5" r="2.5" fill="#ffc107" stroke="#333" stroke-width="0.5"/>
  </g>

  <!-- Port 4: partial — bg-warning + dot -->
  <g class="dv-port">
    <rect x="74"  y="38" width="16" height="16" rx="3" fill="#ffc107" stroke="#cccccc" stroke-width="1"/>
    <text x="82"  y="46" text-anchor="middle" dominant-baseline="central" font-size="7" fill="#fff">4</text>
    <circle cx="87.5" cy="40.5" r="2.5" fill="#ffc107" stroke="#333" stroke-width="0.5"/>
  </g>

  <!-- Port 5: cable colour mode + partial dot (blue cable, partial path) -->
  <g class="dv-port">
    <rect x="92"  y="38" width="16" height="16" rx="3" fill="#3c8dbc" stroke="#cccccc" stroke-width="1"/>
    <text x="100" y="46" text-anchor="middle" dominant-baseline="central" font-size="7" fill="#fff">5</text>
    <circle cx="105.5" cy="40.5" r="2.5" fill="#ffc107" stroke="#333" stroke-width="0.5"/>
  </g>

  <!-- Port 6: enabled unconnected — bg-secondary -->
  <g class="dv-port">
    <rect x="110" y="38" width="16" height="16" rx="3" fill="#6c757d" stroke="#cccccc" stroke-width="1"/>
    <text x="118" y="46" text-anchor="middle" dominant-baseline="central" font-size="7" fill="#fff">6</text>
  </g>

  <!-- Port 7: enabled unconnected — bg-secondary -->
  <g class="dv-port">
    <rect x="128" y="38" width="16" height="16" rx="3" fill="#6c757d" stroke="#cccccc" stroke-width="1"/>
    <text x="136" y="46" text-anchor="middle" dominant-baseline="central" font-size="7" fill="#fff">7</text>
  </g>

  <!-- Port 8: disabled — bg-danger -->
  <g class="dv-port">
    <rect x="146" y="38" width="16" height="16" rx="3" fill="#dc3545" stroke="#cccccc" stroke-width="1"/>
    <text x="154" y="46" text-anchor="middle" dominant-baseline="central" font-size="7" fill="#fff">8</text>
  </g>

  <!-- ── Callout lines ── -->
  <!-- 1+2: full -->
  <line x1="28"  y1="54" x2="28"  y2="70" stroke="#198754" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="46"  y1="54" x2="46"  y2="70" stroke="#198754" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="28"  y1="70" x2="46"  y2="70" stroke="#198754" stroke-width="1"/>
  <line x1="37"  y1="70" x2="37"  y2="82" stroke="#198754" stroke-width="1"/>

  <!-- 3+4: partial fill -->
  <line x1="64"  y1="54" x2="64"  y2="70" stroke="#ffc107" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="82"  y1="54" x2="82"  y2="70" stroke="#ffc107" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="64"  y1="70" x2="82"  y2="70" stroke="#ffc107" stroke-width="1"/>
  <line x1="73"  y1="70" x2="73"  y2="82" stroke="#ffc107" stroke-width="1"/>

  <!-- 5: cable colour + dot -->
  <line x1="100" y1="54" x2="100" y2="82" stroke="#3c8dbc" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- 6+7: unconnected -->
  <line x1="118" y1="54" x2="118" y2="70" stroke="#6c757d" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="136" y1="54" x2="136" y2="70" stroke="#6c757d" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="118" y1="70" x2="136" y2="70" stroke="#6c757d" stroke-width="1"/>
  <line x1="127" y1="70" x2="127" y2="82" stroke="#6c757d" stroke-width="1"/>

  <!-- 8: disabled -->
  <line x1="154" y1="54" x2="154" y2="82" stroke="#dc3545" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ── Legend labels ── -->
  <!-- full connection -->
  <rect x="14"  y="86" width="8" height="8" rx="2" fill="#198754"/>
  <text x="26"  y="94" font-size="9" fill="#e0e0f0">Full connection</text>
  <text x="26" y="106" font-size="8" fill="#888">both ends terminate at a device</text>

  <!-- partial -->
  <rect x="130" y="86" width="8" height="8" rx="2" fill="#ffc107"/>
  <circle cx="136.5" cy="88.5" r="2.5" fill="#ffc107" stroke="#333" stroke-width="0.5"/>
  <text x="142" y="94"  font-size="9" fill="#e0e0f0">Partial connection</text>
  <text x="142" y="106" font-size="8" fill="#888">cable attached, no far-end device</text>

  <!-- cable colour + partial -->
  <rect x="14"  y="118" width="8" height="8" rx="2" fill="#3c8dbc"/>
  <circle cx="20.5" cy="120.5" r="2.5" fill="#ffc107" stroke="#333" stroke-width="0.5"/>
  <text x="26"  y="126" font-size="9" fill="#e0e0f0">Cable colour + partial dot</text>
  <text x="26"  y="138" font-size="8" fill="#888">dot always visible even when cable colour overrides fill</text>

  <!-- unconnected -->
  <rect x="14"  y="150" width="8" height="8" rx="2" fill="#6c757d"/>
  <text x="26"  y="158" font-size="9" fill="#e0e0f0">Enabled, unconnected</text>

  <!-- disabled -->
  <rect x="180" y="150" width="8" height="8" rx="2" fill="#dc3545"/>
  <text x="192" y="158" font-size="9" fill="#e0e0f0">Disabled</text>

  <!-- footer rule -->
  <line x1="14" y1="172" x2="506" y2="172" stroke="#333" stroke-width="0.5"/>
  <text x="14" y="184" font-size="7.5" fill="#555">netbox-device-view — SVG renderer — port status colours applied by JavaScript at page load</text>
</svg>
