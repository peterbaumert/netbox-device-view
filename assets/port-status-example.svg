<svg xmlns="http://www.w3.org/2000/svg"
     width="480" height="340"
     viewBox="0 0 480 340"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <defs>
    <pattern id="dv-nocolor-pattern" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(-45)">
      <rect width="5" height="10" fill="grey"/>
      <rect x="5" width="5" height="10" fill="black"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="480" height="340" rx="10" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="20" y="28" font-size="11" font-weight="bold" fill="#cdd6f4" letter-spacing="0.04em">Port Status — SVG Renderer</text>
  <line x1="20" y1="36" x2="460" y2="36" stroke="#313244" stroke-width="1"/>

  <!-- ── Row 1: Full connection ── -->
  <!-- Port swatch -->
  <rect x="20" y="52" width="36" height="36" rx="5" fill="#1a1a2e" stroke="#45475a" stroke-width="1"/>
  <rect x="26" y="58" width="24" height="24" rx="4" fill="#198754" stroke="#cccccc" stroke-width="1"/>
  <text x="38" y="70" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#fff">Gi1</text>
  <!-- Label -->
  <text x="72" y="68" font-size="13" font-weight="bold" fill="#a6e3a1">Full connection</text>
  <text x="72" y="84" font-size="10" fill="#6c7086">Both ends of the cable path terminate at a device interface</text>

  <!-- Divider -->
  <line x1="20" y1="100" x2="460" y2="100" stroke="#313244" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── Row 2: Partial connection ── -->
  <rect x="20" y="112" width="36" height="36" rx="5" fill="#1a1a2e" stroke="#45475a" stroke-width="1"/>
  <rect x="26" y="118" width="24" height="24" rx="4" fill="#ffc107" stroke="#cccccc" stroke-width="1"/>
  <text x="38" y="130" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#fff">Gi2</text>
  <!-- partial dot on port -->
  <circle cx="48" cy="120" r="4" fill="#ffc107" stroke="#1e1e2e" stroke-width="1.5"/>
  <!-- Label -->
  <text x="72" y="128" font-size="13" font-weight="bold" fill="#f9e2af">Partial connection</text>
  <text x="72" y="144" font-size="10" fill="#6c7086">Cable attached but path has no far-end device (e.g. open patch panel port)</text>

  <!-- Divider -->
  <line x1="20" y1="160" x2="460" y2="160" stroke="#313244" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── Row 3: Cable colour + partial dot ── -->
  <rect x="20" y="172" width="36" height="36" rx="5" fill="#1a1a2e" stroke="#45475a" stroke-width="1"/>
  <rect x="26" y="178" width="24" height="24" rx="4" fill="#3c8dbc" stroke="#cccccc" stroke-width="1"/>
  <text x="38" y="190" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#fff">Gi3</text>
  <!-- partial dot on port -->
  <circle cx="48" cy="180" r="4" fill="#ffc107" stroke="#1e1e2e" stroke-width="1.5"/>
  <!-- Label -->
  <text x="72" y="188" font-size="13" font-weight="bold" fill="#89dceb">Cable colour mode + partial dot</text>
  <text x="72" y="204" font-size="10" fill="#6c7086">Cable hex colour fills the port — warning dot remains visible on top</text>

  <!-- Divider -->
  <line x1="20" y1="220" x2="460" y2="220" stroke="#313244" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── Row 4: Enabled, unconnected ── -->
  <rect x="20" y="232" width="36" height="36" rx="5" fill="#1a1a2e" stroke="#45475a" stroke-width="1"/>
  <rect x="26" y="238" width="24" height="24" rx="4" fill="#6c757d" stroke="#cccccc" stroke-width="1"/>
  <text x="38" y="250" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#fff">Gi4</text>
  <!-- Label -->
  <text x="72" y="248" font-size="13" font-weight="bold" fill="#bac2de">Enabled, unconnected</text>
  <text x="72" y="264" font-size="10" fill="#6c7086">Port is enabled but no cable is attached</text>

  <!-- Divider -->
  <line x1="20" y1="280" x2="460" y2="280" stroke="#313244" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ── Row 5: Disabled ── -->
  <rect x="20" y="292" width="36" height="36" rx="5" fill="#1a1a2e" stroke="#45475a" stroke-width="1"/>
  <rect x="26" y="298" width="24" height="24" rx="4" fill="#dc3545" stroke="#cccccc" stroke-width="1"/>
  <text x="38" y="310" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#fff">Gi5</text>
  <!-- Label -->
  <text x="72" y="308" font-size="13" font-weight="bold" fill="#f38ba8">Disabled</text>
  <text x="72" y="324" font-size="10" fill="#6c7086">Port is administratively disabled</text>

</svg>
