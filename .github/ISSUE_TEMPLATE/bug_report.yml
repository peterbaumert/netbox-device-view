name: Bug Report
description: Report a problem with netbox-device-view
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing a bug, please check [existing issues](https://github.com/peterbaumert/netbox-device-view/issues) to avoid duplicates.

  - type: input
    id: netbox_version
    attributes:
      label: NetBox version
      placeholder: "e.g. 4.2.0"
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      placeholder: "e.g. 0.1.15"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, relevant CSS/config snippets, etc.
