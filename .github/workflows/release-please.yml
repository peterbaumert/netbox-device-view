name: Release Please

on:
  push:
    branches:
      - main

env:
  NETBOX_VERSION: "4.5.x-4.7.x"  # update when testing against a new NetBox version

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}

      - name: Insert new row into COMPATIBILITY.md
        if: ${{ steps.release.outputs.pr }}
        run: |
          VERSION="${{ fromJson(steps.release.outputs.pr).title }}"
          VERSION="${VERSION##* }"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          python3 - "$VERSION" "${{ env.NETBOX_VERSION }}" << 'PYEOF'
          import sys

          version, netbox_version = sys.argv[1], sys.argv[2]
          path = "COMPATIBILITY.md"
          with open(path) as f:
              lines = f.readlines()

          header = "| Plugin version | NetBox version | Python | Notes |\n"
          try:
              idx = lines.index(header)
          except ValueError:
              sys.exit(f"Could not find table header in {path}")

          # Insert new row immediately after the separator row (idx + 1),
          # which is right below the header line.
          new_row = f"| {version} | {netbox_version} | 3.12+ | Tested |\n"
          lines.insert(idx + 2, new_row)

          with open(path, "w") as f:
              f.writelines(lines)
          PYEOF

      - name: Commit COMPATIBILITY.md to release PR branch
        if: ${{ steps.release.outputs.pr }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add COMPATIBILITY.md
          git diff --cached --quiet || git commit -m "chore: add ${VERSION} to COMPATIBILITY.md"
          git push

      - name: Check out repo for PyPI publish
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Set up Python
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        if: ${{ steps.release.outputs.release_created }}
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        if: ${{ steps.release.outputs.release_created }}
        uses: pypa/gh-action-pypi-publish@release/v1
