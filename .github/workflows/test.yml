name: Test

# push is restricted to main (post-merge) rather than every branch — a
# feature branch with an open PR would otherwise run this workflow twice
# per commit (once for push, once for pull_request's synchronize event).
# pull_request has no branch filter, so every PR still gets full coverage.
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: test
            tests: tests/
            branching: false
          - check: test-branching
            tests: tests/test_branching.py
            branching: true
    container:
      image: netboxcommunity/netbox:v4.7.0

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:9-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Write NetBox configuration
        run: |
          mkdir -p /etc/netbox/config
          cat > /etc/netbox/config/configuration.py << 'EOF'
          ALLOWED_HOSTS = ['*']
          SECRET_KEY = 'ci-test-secret-key-not-used-in-production-abcdefghijklmnopqrstuvwxyz0123456789'
          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.postgresql',
                  'NAME': 'netbox',
                  'USER': 'netbox',
                  'PASSWORD': 'netbox',
                  'HOST': 'postgres',
                  'PORT': '',
              }
          }
          REDIS = {
              'tasks': {
                  'HOST': 'redis',
                  'PORT': 6379,
                  'DATABASE': 0,
                  'SSL': False,
              },
              'caching': {
                  'HOST': 'redis',
                  'PORT': 6379,
                  'DATABASE': 1,
                  'SSL': False,
              },
          }
          EOF
          cat > /etc/netbox/config/extra.py << 'EOF'
          PLUGINS = ['netbox_device_view']
          PLUGINS_CONFIG = {'netbox_device_view': {'show_on_device_tab': False}}
          # v2 API tokens (the non-deprecated format — v1 is deprecated as
          # of NetBox 4.6, removal planned for v5.0) require this; CI-only
          # placeholder value, not a real secret.
          API_TOKEN_PEPPERS = {1: 'ci-test-pepper-not-a-secret-0123456789abcdef0123456789ab'}
          EOF

      - name: Install plugin and test dependencies
        run: |
          uv pip install --python /opt/netbox/venv/bin/python \
            --no-cache pytest pytest-django -e .

      - name: Enable NetBox Branching
        if: matrix.branching
        run: |
          uv pip install --python /opt/netbox/venv/bin/python \
            --no-cache -r .github/requirements-branching.txt
          cat >> /etc/netbox/config/configuration.py << 'EOF'
          from netbox_branching.utilities import DynamicSchemaDict
          DATABASES = DynamicSchemaDict(DATABASES)
          DATABASE_ROUTERS = ['netbox_branching.database.BranchAwareRouter']
          EOF
          # netbox_branching must be the last plugin.
          echo "PLUGINS.append('netbox_branching')" >> /etc/netbox/config/extra.py

      - name: Run tests
        env:
          TESTS: ${{ matrix.tests }}
        run: /opt/netbox/venv/bin/pytest "$TESTS" -v --junitxml=pytest.xml

      # The branching tests skip when the plugin is not enabled, so a skip means a broken setup.
      - name: Check that no NetBox Branching test skipped
        if: matrix.branching
        run: |
          /opt/netbox/venv/bin/python - << 'EOF'
          import sys
          import xml.etree.ElementTree as ET

          suite = next(ET.parse("pytest.xml").getroot().iter("testsuite"))
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          if tests == 0 or skipped:
              sys.exit(f"{skipped} of {tests} NetBox Branching tests skipped.")
          print(f"{tests} NetBox Branching tests ran.")
          EOF
