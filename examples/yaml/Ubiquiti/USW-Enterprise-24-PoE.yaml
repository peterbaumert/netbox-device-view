version: 1

meta:
  description: "Ubiquiti UniFi Switch Enterprise 24 PoE"

canvas:
  columns: 32
  rows: 2

views:
  front:
    rows:
      # Row 1: an empty decorative row
      - elements:
          - kind: blank
            key: "x"
            span: {cols: 32}
      # Row 2: the next "elements" entries stay in row 2, the last canvas row
      - elements:
          - kind: blank
            key: "y"
            span: {cols: 2}
      - sequence:
          kind: port
          prefix: "port-"
          start: 1
          count: 8
          pattern: all
          row: 2
      - elements:
          - kind: spacer
            key: "s1"
      - sequence:
          kind: port
          prefix: "port-"
          start: 9
          count: 8
          pattern: all
          row: 2
      - elements:
          - kind: spacer
            key: "s2"
      - sequence:
          kind: port
          prefix: "port-"
          start: 17
          count: 8
          pattern: all
          row: 2
      - elements:
          - kind: spacer
            key: "s3"
      - elements:
          - kind: interface
            key: "sfp--25"
          - kind: interface
            key: "sfp--26"
          - kind: blank
            key: "z"
