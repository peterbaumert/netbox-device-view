version: 1

meta:
  description: "Generic 48-port UTP Patch Panel"
  # Ports named "Port 1" ... "Port 48" front and rear

canvas:
  columns: 27  # per row: 24 ports and 3 spacers
  rows: 2
  cell_size: 0  # patch-panel: auto sizing

views:
  front:
    rows:
      - sequence:
          kind: port
          prefix: "port-"
          start: 1
          count: 6
          pattern: all
          row: 1
      - sequence:
          kind: port
          prefix: "port-"
          start: 25
          count: 6
          pattern: all
          row: 2
      - spacer: 1
      - sequence:
          kind: port
          prefix: "port-"
          start: 7
          count: 6
          pattern: all
          row: 1
      - sequence:
          kind: port
          prefix: "port-"
          start: 31
          count: 6
          pattern: all
          row: 2
      - spacer: 1
      - sequence:
          kind: port
          prefix: "port-"
          start: 13
          count: 6
          pattern: all
          row: 1
      - sequence:
          kind: port
          prefix: "port-"
          start: 37
          count: 6
          pattern: all
          row: 2
      - spacer: 1
      - sequence:
          kind: port
          prefix: "port-"
          start: 19
          count: 6
          pattern: all
          row: 1
      - sequence:
          kind: port
          prefix: "port-"
          start: 43
          count: 6
          pattern: all
          row: 2

  rear:
    copy_from: front
