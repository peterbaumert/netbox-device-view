version: 1

meta:
  description: "Generic LC 48-port Fiber Patch Panel"
  # Front and rear ports named "Port 1" ... "Port 48"

canvas:
  columns: 24
  rows: 2
  cell_size: 0  # patch-panel: auto sizing

views:
  front:
    rows:
      - sequence:
          kind: port
          prefix: "port-"
          start: 1
          count: 24
          pattern: all
      - sequence:
          kind: port
          prefix: "port-"
          start: 25
          count: 24
          pattern: all

  rear:
    copy_from: front
